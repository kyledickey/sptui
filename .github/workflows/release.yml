# Pushing a tag like v1.2.0 builds sptui for every platform and uploads the
# archives to its GitHub release, which install.sh downloads from.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sptui_*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum sptui_*.tar.gz | tee checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GH_REPO" --verify-tag --generate-notes
          fi
