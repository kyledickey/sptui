name: install

on:
    push:
        branches: [main]
        paths: [internal/web/site/install.sh, .github/workflows/install.yml]
    pull_request:
        paths: [internal/web/site/install.sh, .github/workflows/install.yml]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        uses: ./.github/workflows/build.yml
        with:
            targets: '["linux_amd64", "linux_arm64"]'

    linux:
        name: ${{ matrix.name }}
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: ubuntu 22.04
                      runs-on: ubuntu-latest
                      container: ubuntu:22.04
                      target: linux_amd64
                      setup: apt-get update -q && apt-get install -y -q curl ca-certificates
                    - name: ubuntu 24.04
                      runs-on: ubuntu-latest
                      container: ubuntu:24.04
                      target: linux_amd64
                      setup: apt-get update -q && apt-get install -y -q curl ca-certificates
                    - name: debian
                      runs-on: ubuntu-latest
                      container: debian:stable
                      target: linux_amd64
                      setup: apt-get update -q && apt-get install -y -q curl ca-certificates
                    - name: fedora
                      runs-on: ubuntu-latest
                      container: fedora:latest
                      target: linux_amd64
                    - name: arch
                      runs-on: ubuntu-latest
                      container: archlinux:latest
                      target: linux_amd64
                      setup: pacman -Syu --noconfirm
                    - name: ubuntu arm64, with sudo
                      runs-on: ubuntu-24.04-arm
                      target: linux_arm64
        runs-on: ${{ matrix.runs-on }}
        container: ${{ matrix.container }}
        steps:
            - if: matrix.setup
              run: ${{ matrix.setup }}
            - uses: actions/checkout@v5
            - uses: actions/download-artifact@v4
              with:
                  name: sptui_${{ matrix.target }}
                  path: dist
            - run: bash internal/web/site/install.sh --yes
              env:
                  SPTUI_ARCHIVE: dist/sptui_${{ matrix.target }}.tar.gz
            - run: '"$HOME/.local/bin/sptui" -version'

    macos:
        name: macos, bash 3.2
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - name: Stand-in archive
              run: |
                  mkdir stub
                  printf '#!/bin/sh\necho "sptui dev"\n' >stub/sptui
                  chmod +x stub/sptui
                  tar -czf sptui_darwin_arm64.tar.gz -C stub sptui
            - run: /bin/bash --version | head -1
            - run: /bin/bash internal/web/site/install.sh --yes
              env:
                  SPTUI_ARCHIVE: sptui_darwin_arm64.tar.gz
            - run: '"$HOME/.local/bin/sptui" -version'
