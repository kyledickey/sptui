name: install

on:
    push:
        branches: [main]
        paths: [internal/web/site/install.sh, internal/web/site/install.ps1, .github/workflows/install.yml]
    pull_request:
        paths: [internal/web/site/install.sh, internal/web/site/install.ps1, .github/workflows/install.yml]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        uses: ./.github/workflows/build.yml
        with:
            targets: '["linux_amd64", "linux_arm64", "windows_amd64"]'

    linux:
        name: ${{ matrix.name }}
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: ubuntu 22.04
                      runs-on: ubuntu-latest
                      container: ubuntu:22.04
                      target: linux_amd64
                      setup: apt-get update -q && apt-get install -y -q curl ca-certificates
                    - name: ubuntu 24.04
                      runs-on: ubuntu-latest
                      container: ubuntu:24.04
                      target: linux_amd64
                      setup: apt-get update -q && apt-get install -y -q curl ca-certificates
                    - name: debian
                      runs-on: ubuntu-latest
                      container: debian:stable
                      target: linux_amd64
                      setup: apt-get update -q && apt-get install -y -q curl ca-certificates
                    - name: fedora
                      runs-on: ubuntu-latest
                      container: fedora:latest
                      target: linux_amd64
                    - name: arch
                      runs-on: ubuntu-latest
                      container: archlinux:latest
                      target: linux_amd64
                      setup: pacman -Syu --noconfirm
                    - name: ubuntu arm64, with sudo
                      runs-on: ubuntu-24.04-arm
                      target: linux_arm64
        runs-on: ${{ matrix.runs-on }}
        container: ${{ matrix.container }}
        steps:
            - if: matrix.setup
              run: ${{ matrix.setup }}
            - uses: actions/checkout@v5
            - uses: actions/download-artifact@v4
              with:
                  name: sptui_${{ matrix.target }}
                  path: dist
            - run: bash internal/web/site/install.sh --yes
              env:
                  SPTUI_ARCHIVE: dist/sptui_${{ matrix.target }}.tar.gz
            - run: '"$HOME/.local/bin/sptui" -version'

    macos:
        name: macos, bash 3.2
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - name: Stand-in archive
              run: |
                  mkdir stub
                  printf '#!/bin/sh\necho "sptui dev"\n' >stub/sptui
                  chmod +x stub/sptui
                  tar -czf sptui_darwin_arm64.tar.gz -C stub sptui
            - run: /bin/bash --version | head -1
            - run: /bin/bash internal/web/site/install.sh --yes
              env:
                  SPTUI_ARCHIVE: sptui_darwin_arm64.tar.gz
            - run: '"$HOME/.local/bin/sptui" -version'

    windows:
        name: windows, ${{ matrix.shell }}
        needs: build
        strategy:
            fail-fast: false
            matrix:
                shell: [pwsh, powershell] # PowerShell 7, and Windows PowerShell 5.1
        runs-on: windows-latest
        defaults:
            run:
                shell: ${{ matrix.shell }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/download-artifact@v4
              with:
                  name: sptui_windows_amd64
                  path: dist
            - name: Install
              run: ./internal/web/site/install.ps1
              env:
                  SPTUI_ARCHIVE: dist/sptui_windows_amd64.zip
            - name: Install again, over the first
              run: ./internal/web/site/install.ps1
              env:
                  SPTUI_ARCHIVE: dist/sptui_windows_amd64.zip
            - name: Runs from PATH, in a new shell
              run: |
                  $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
                  sptui -version
                  if ($LASTEXITCODE -ne 0) { exit 1 }
            - name: Piped into iex, the way the site says
              run: Get-Content -Raw ./internal/web/site/install.ps1 | Invoke-Expression
              env:
                  SPTUI_ARCHIVE: dist/sptui_windows_amd64.zip
            - name: Fails when it should
              run: |
                  $env:SPTUI_ARCHIVE = 'nope.zip'
                  ./internal/web/site/install.ps1
                  if ($LASTEXITCODE -ne 1) { Write-Error "exit code $LASTEXITCODE, want 1"; exit 1 }
                  exit 0
