# Builds the release archives (see .github/scripts/build.sh) and uploads each
# as an artifact named after it. Called by ci and release.
name: build

on:
    workflow_call:
        inputs:
            version:
                type: string
                default: dev
            targets:
                description: JSON list of the targets to build
                type: string
                default: '["linux_amd64", "linux_arm64", "darwin_arm64", "darwin_amd64", "windows_amd64"]'

jobs:
    build:
        name: build (${{ matrix.target }})
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(inputs.targets) }}
        runs-on: >-
            ${{ fromJSON('{
              "linux_amd64": "ubuntu-latest",
              "linux_arm64": "ubuntu-24.04-arm",
              "darwin_arm64": "macos-latest",
              "darwin_amd64": "macos-15-intel",
              "windows_amd64": "windows-latest"
            }')[matrix.target] }}
        container: ${{ startsWith(matrix.target, 'linux') && 'debian:bookworm' || '' }}
        steps:
            - name: Build tools (Linux)
              if: runner.os == 'Linux'
              run: |
                  apt-get update -q
                  apt-get install -y -q --no-install-recommends ca-certificates curl gcc libc6-dev make bzip2 pkg-config \
                    libogg-dev libvorbis-dev libflac-dev libasound2-dev
            - name: Build tools (macOS)
              if: runner.os == 'macOS'
              run: brew install --quiet libogg libvorbis flac mpg123 pkgconf
            - name: Build tools (Windows)
              if: runner.os == 'Windows'
              uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  path-type: inherit # so it finds setup-go's Go
                  install: >-
                      zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
                      mingw-w64-ucrt-x86_64-libogg mingw-w64-ucrt-x86_64-libvorbis
                      mingw-w64-ucrt-x86_64-flac mingw-w64-ucrt-x86_64-mpg123
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - if: runner.os != 'Windows'
              run: .github/scripts/build.sh "${{ inputs.version }}"
            - if: runner.os == 'Windows'
              shell: msys2 {0}
              run: .github/scripts/build.sh "${{ inputs.version }}"
            - uses: actions/upload-artifact@v4
              with:
                  name: sptui_${{ matrix.target }}
                  path: dist/sptui_${{ matrix.target }}.*
                  if-no-files-found: error
